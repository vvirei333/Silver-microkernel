# TB321FU Linux Boot Configuration
# Loaded dynamically by QCOMRAMP.EFI / GRUB

set timeout=3
set default=0
set gfxpayload=keep

menuentry "TB321FU Linux (Visual Console - Large Font)" {
    search --no-floppy --file /Image --set=root
    devicetree /dtb/platform.dtb
    if [ -f /initramfs.cpio.gz ]; then
        initrddirect /initramfs.cpio.gz
    fi
    qcomfdtmem source rampartition
    qcomfdtmem disable-reserved         /reserved-memory/qdss@82800000         /reserved-memory/splash-region         /reserved-memory/trust-ui-vm@f3800000         /reserved-memory/oem-vm@f7c00000
    linuxdirect /Image root=PARTLABEL=tb321fu-root rw rootwait console=ttyMSM0,115200n8 console=tty0 fbcon=font:TER16x32 keep_bootcon systemd.show_status=1 loglevel=7
}

menuentry "TB321FU Linux (Visual Console - Rotated 90 deg)" {
    search --no-floppy --file /Image --set=root
    devicetree /dtb/platform.dtb
    if [ -f /initramfs.cpio.gz ]; then
        initrddirect /initramfs.cpio.gz
    fi
    qcomfdtmem source rampartition
    qcomfdtmem disable-reserved         /reserved-memory/qdss@82800000         /reserved-memory/splash-region         /reserved-memory/trust-ui-vm@f3800000         /reserved-memory/oem-vm@f7c00000
    linuxdirect /Image root=PARTLABEL=tb321fu-root rw rootwait console=ttyMSM0,115200n8 console=tty0 fbcon=font:TER16x32 fbcon=rotate:1 keep_bootcon systemd.show_status=1 loglevel=7
}

menuentry "TB321FU Linux (Emergency Rescue Shell)" {
    search --no-floppy --file /Image --set=root
    devicetree /dtb/platform.dtb
    if [ -f /initramfs.cpio.gz ]; then
        initrddirect /initramfs.cpio.gz
    fi
    qcomfdtmem source rampartition
    qcomfdtmem disable-reserved         /reserved-memory/qdss@82800000         /reserved-memory/splash-region         /reserved-memory/trust-ui-vm@f3800000         /reserved-memory/oem-vm@f7c00000
    linuxdirect /Image root=PARTLABEL=tb321fu-root rw rootwait console=ttyMSM0,115200n8 console=tty0 fbcon=font:TER16x32 keep_bootcon systemd.unit=rescue.target loglevel=7
}

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
