# TB321FU boot config: linuxdirect is the DEFAULT path now.
# The EFI-app chainloader experiment proved `msr sctlr_el1` with M:1->0 from
# the GRUB EL1 context kills the vCPU silently — see tablet/HANDOFF.md.
# linuxdirect hands over the way ABL hands to the stock kernel.
#
# NOTE: the command set mirrors the known-good port config exactly:
# `search` must set $root, `devicetree` must load the FDT BEFORE
# `qcomfdtmem`, and `disable-reserved` must carry its 4 paths — dropping
# any of these gives "UEFI dump table info not found" and no jump.
set default=0
set timeout=5

menuentry "Silver (linuxdirect)" {
    search --no-floppy --file /Image --set=root
    devicetree /dtb/platform.dtb
    qcomfdtmem source rampartition
    qcomfdtmem disable-reserved /reserved-memory/qdss@82800000 /reserved-memory/splash-region /reserved-memory/trust-ui-vm@f3800000 /reserved-memory/oem-vm@f7c00000
    linuxdirect /Image
}
