[package]
name = "silver_userspace"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Bare-metal TCP/IP stack. `std`/`alloc` stay off: the server uses fixed
# static storage for sockets and frame buffers. `medium-ethernet` implies
# smoltcp's `socket` feature, which only compiles with a concrete socket type;
# ICMP provides the boot-time echo request, UDP is for later services.
smoltcp = { version = "0.14", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
