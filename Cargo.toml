[package]
name = "silver_microkernel"
version = "0.1.0"
edition = "2021"
description = "AArch64 mobile microkernel with a Rust foundation"
license = "MIT"

[features]
default = ["std"]
std = []
no_std = []
# Opt-in QEMU SMP bring-up (up to MAX_CPUS = 4 on `-smp 4`; slots the machine
# does not expose stay offline). Default builds stay single-core; the fog/tablet
# profiles force one CPU regardless of this feature.
smp = []
# Opt-in QEMU self-test: after the APs are launched, run a cross-PE TLB probe
# (each AP reads a VA, the boot CPU re-points the same PTE, each AP must see
# the new frame), then 64 back-to-back SGI1 stop-the-world rounds, verify
# cross-CPU visibility, check that every online CPU advances its own timer
# tick, verify the running_on/current_index pairing on every scheduling pass,
# and report PASS/FAIL. Kernel-only; no userspace protocol is involved.
smp-selftest = ["smp"]
# Opt-in diagnostic stress: spawn short-lived kernel tasks while the APs run
# and reap them, with the per-pass scheduler invariant audit enabled. Stable
# with `-smp 4` (the supported SMP layout); kept out of `smp-selftest` because
# `cpu_count()` assumes `MAX_CPUS`, so a machine with fewer online CPUs would
# fail the harness's "N CPUs took part" policy rather than the scheduler.
smp-churn = ["smp-selftest"]
demo-tasks = []
tablet = []
# Opt-in diagnostic: print one console line per unsupported Linux ABI syscall
# (capped), used while bringing up a libc.
linux-abi-trace = []
fog = []
# Explicit opt-in for the fog image's self-relocation to `__kernel_link_pa`.
# Standard fog builds stay at the address ABL chose and park when it differs
# from the link address; enabling this requires an independently proven free
# destination and the live FDT check tracked in the bring-up notes.
fog-reloc = ["fog"]
# Real-device bring-up convenience: after the scheduler and the timer are up,
# reset the machine through PSCI `SYSTEM_RESET` so a RAM-only diagnostic boot
# returns to Android without holding the power key. Never part of a release
# image.
fog-auto-reset = ["fog"]
# Opt-in: run the newer MMU/ASID/DMA boot self-tests on fog hardware. They are
# QEMU-proven but can wedge a real unit before userspace starts, so the default
# fog image skips them (and logs that it did). QEMU builds always run them.
fog-hw-selftests = ["fog"]
# Opt-in bisect test: unmask IRQs and wait for 30 timer ticks before the
# scheduler is initialised. Useful on QEMU; on the first hardware boot it can
# deliver a timer IRQ into a not-yet-initialised scheduler, so fog defaults off.
fog-timer-test = ["fog"]

[dependencies]
linked_list_allocator = "0.10.6"
# Ed25519 verification for bundle manifests. `alloc` keeps the kernel build
# no_std; signing is done by the host-only `sign_bundle` tool.
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
