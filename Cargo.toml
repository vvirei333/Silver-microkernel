[package]
name = "silver_microkernel"
version = "0.1.0"
edition = "2021"
description = "AArch64 mobile microkernel with a Rust foundation"

[features]
default = ["std"]
std = []
no_std = []

[dependencies]
linked_list_allocator = "0.10.6"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
